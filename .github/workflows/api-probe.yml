name: api probe

# A spike. Manual only — no cron, deliberately. It authenticates against the
# official LaLiga Fantasy API and reports what the JSON looks like.
#
# Every call is a GET. The API also has bid/offer/sell/buyout-pay routes; this
# workflow never touches them.
#
# AUTH — set ONE of these under Settings -> Secrets and variables -> Actions:
#
#   LALIGA_REFRESH_TOKEN   Facebook/Google logins. Obtained by running this
#                          workflow once with the auth_code input filled in
#                          (see LALIGA_CODE_VERIFIER below); after that the
#                          workflow keeps it fresh by itself.
#
#   LALIGA_CODE_VERIFIER   The PKCE verifier matching the authorize URL you
#                          opened. Needed only for that first code exchange.
#
#   LALIGA_EMAIL + LALIGA_PASSWORD   Accounts with a local password. No
#                          browser needed, ever. Prefer this if you can.
#
# ROTATION: B2C issues a new refresh token each time the old one is used, so
# the stored secret goes stale after one run. Set ROTATE_PAT (a fine-grained
# PAT with this repo's "Secrets: read and write" permission) and the workflow
# updates the secret itself. Without it, re-capture from the browser each run.
on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "League id (blank = first league on the account)"
        required: false
        default: ""
      team_id:
        description: "Team id (blank = first in the standing)"
        required: false
        default: ""
      auth_code:
        description: "One-time code from the redirect (social login, first run only)"
        required: false
        default: ""
      commit:
        description: "Commit reports/api_probe.md? (it names your rivals)"
        required: true
        default: "yes"
        type: choice
        options: [ "yes", "no" ]

permissions:
  contents: write

concurrency:
  group: api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx

      - name: Probe
        id: probe
        env:
          LALIGA_AUTH_CODE: ${{ inputs.auth_code }}
          # Only needed if you used the native-client authorize URL.
          FF_CLIENT_ID: ${{ vars.FF_CLIENT_ID }}
          FF_REDIRECT_URI: ${{ vars.FF_REDIRECT_URI }}
          LALIGA_CODE_VERIFIER: ${{ secrets.LALIGA_CODE_VERIFIER }}
          LALIGA_REFRESH_TOKEN: ${{ secrets.LALIGA_REFRESH_TOKEN }}
          LALIGA_EMAIL: ${{ secrets.LALIGA_EMAIL }}
          LALIGA_PASSWORD: ${{ secrets.LALIGA_PASSWORD }}
          FF_LEAGUE_ID: ${{ inputs.league_id }}
          FF_TEAM_ID: ${{ inputs.team_id }}
        run: python src/fantasy_api.py

      # The rotated token never appears in a log: it is read from a file and
      # piped straight into the secret.
      - name: Store the rotated refresh token
        if: steps.probe.outputs.rotated == 'true' && env.ROTATE_PAT != ''
        env:
          ROTATE_PAT: ${{ secrets.ROTATE_PAT }}
          GH_TOKEN: ${{ secrets.ROTATE_PAT }}
        run: |
          gh secret set LALIGA_REFRESH_TOKEN \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(cat /tmp/ff_refresh_token)"
          echo "refresh token secret updated"

      - name: Warn if the token rotated and cannot be stored
        if: steps.probe.outputs.rotated == 'true' && env.ROTATE_PAT == ''
        env:
          ROTATE_PAT: ${{ secrets.ROTATE_PAT }}
        run: |
          echo "::warning::The refresh token rotated but ROTATE_PAT is not set,
          so the stored secret is now stale. The next run will fail until you
          re-capture a token from the browser."

      - name: Commit the probe report
        if: inputs.commit == 'yes'
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -A reports/api_probe.md
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "api probe $(date -u +%FT%RZ)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -X theirs; then
              if git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 7
          done
          echo "::error::could not push after 3 attempts"
          exit 1
