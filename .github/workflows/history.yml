name: history

# Once a season, by hand. Fetches last season's per-player points from
# futbolfantasy analytics so report.py has a baseline to score players with
# before any jornada of the new season has been played.
#
# Run it again if the parse looks wrong — the raw HTML is saved either way,
# and a failed parse leaves the previous CSV untouched.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL (leave blank for the default points table)"
        required: false
        default: ""
      label:
        description: "Season label for filenames, e.g. 2025-26 (blank = auto)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx lxml

      - name: Scrape season points
        env:
          FF_ROOT: ./data
          IN_URL: ${{ inputs.url }}
          IN_LABEL: ${{ inputs.label }}
        run: |
          args=""
          [ -n "$IN_URL" ]   && args="$args --url $IN_URL"
          [ -n "$IN_LABEL" ] && args="$args --label $IN_LABEL"
          python src/history.py $args

      - name: Commit
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -A data/raw data/season
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "history: season points $(date -u +%FT%RZ)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -X theirs; then
              if git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "attempt $attempt failed; retrying"
            sleep 7
          done
          echo "::error::could not push after 3 attempts"
          exit 1
