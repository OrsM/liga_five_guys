name: history

# Two jobs in one workflow, chosen by the mode input:
#
#   baseline — last completed season's points, the number report.py scores
#              players with. Run once a season, by hand.
#   live     — this season's running totals, dated so they accumulate. Runs
#              weekly on its own; report.py does not read these. They exist so
#              the recommendations in data/decisions/squad_log.csv can be
#              scored against what actually happened, later.
#
# The scheduled run is always live. A manual run defaults to baseline.
on:
  schedule:
    # Tuesday 06:20 UTC — after the weekend's jornada has settled.
    - cron: "20 6 * * 2"
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline (last season) or live (this season, dated)"
        required: true
        default: "baseline"
        type: choice
        options: [baseline, live]
      url:
        description: "Page URL (blank = default points table)"
        required: false
        default: ""
      label:
        description: "Season label, e.g. 2025-26 (blank = auto)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx lxml

      - name: Scrape season points
        env:
          FF_ROOT: ./data
          MODE: ${{ inputs.mode || 'live' }}
          IN_URL: ${{ inputs.url }}
          IN_LABEL: ${{ inputs.label }}
        run: |
          args=""
          [ "$MODE" = "live" ] && args="$args --live"
          [ -n "$IN_URL" ]     && args="$args --url $IN_URL"
          [ -n "$IN_LABEL" ]   && args="$args --label $IN_LABEL"
          echo "mode=$MODE"
          python src/history.py $args

      - name: Commit
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -A data/raw data/season
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "history: ${{ inputs.mode || 'live' }} points $(date -u +%FT%RZ)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -X theirs; then
              if git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "attempt $attempt failed; retrying"
            sleep 7
          done
          echo "::error::could not push after 3 attempts"
          exit 1
