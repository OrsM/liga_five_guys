name: lookup players

# Run from the Actions tab. Type surnames into the "names" box, or leave it
# blank and it reads lookup.txt from the repo root (easier on mobile, where
# the input box can be fiddly).
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Surnames, space separated (e.g. starfelt normand zubeldia)'
        required: false
        default: ''
      team:
        description: 'Or a single team slug, to list its whole squad (e.g. deportivo)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve
        env:
          FF_ROOT: ./data
          NAMES: ${{ inputs.names }}
          TEAM: ${{ inputs.team }}
        run: |
          mkdir -p reports
          {
            echo '# Player lookup'
            echo
            echo '```'
            if [ -n "$TEAM" ]; then
              python src/find_slug.py --team "$TEAM"
            elif [ -n "$NAMES" ]; then
              python src/find_slug.py --many $NAMES
            elif [ -f inputs/lookup.txt ]; then
              # One query per line; blank lines and # comments ignored.
              python src/find_slug.py --file
            else
              echo "Nothing to look up: pass names/team, or create inputs/lookup.txt"
            fi
            echo '```'
          } > reports/lookup.md
          cat reports/lookup.md

      - name: Commit
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add reports/lookup.md
          git diff --staged --quiet || git commit -m "lookup"
          git pull --rebase && git push
