name: market

# Reads the tidy CSVs your ingest workflow already commits. It does NOT
# scrape — bump the cron in your existing ingest workflow if you want
# fresher data than twice a day.
on:
  schedule:
    # 40 min after each 3-hourly slot, to land after an ingest run.
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # squads.py and watch.py use only the standard library on purpose,
      # so there is nothing to install.

      - name: Squads and watchlist
        run: python src/squads.py

      - name: Watch for alerts
        id: watch
        run: python src/watch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/state reports inputs/squad.txt
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "market: $(date -u +%FT%RZ)"
            # the ingest workflow commits too — rebase before pushing
            git pull --rebase --autostash
            git push
          fi

      - name: Open an issue if something fired
        if: steps.watch.outputs.fired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Market alert $(date -u +%F\ %R)" \
            --body-file reports/alerts.md
