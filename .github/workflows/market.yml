name: market

# Every 3 hours, plus a manual button. Cron is UTC and GitHub can delay a
# scheduled run by 10-20 minutes under load — fine for this.
on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ingest
        run: python src/ff_ingest.py

      - name: Squads and watchlist
        run: python src/squads.py

      - name: Watch for alerts
        id: watch
        run: python src/watch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports
          git diff --staged --quiet || git commit -m "market: $(date -u +%FT%RZ)"
          git push

      - name: Open an issue if something fired
        if: steps.watch.outputs.fired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Market alert $(date -u +%F\ %R)" \
            --body-file reports/alerts.md
