name: market

# Reads the tidy CSVs your ingest workflow already commits. It does NOT
# scrape — bump the cron in your existing ingest workflow if you want
# fresher data than twice a day.
on:
  schedule:
    # 40 min after each 3-hourly slot, to land after an ingest run.
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # squads.py and watch.py use only the standard library on purpose,
      # so there is nothing to install.

      - name: Squads and watchlist
        run: python src/squads.py

      - name: Watch for alerts
        id: watch
        run: python src/watch.py

      # Housekeeping. Self-healing, so it can stay here forever: it drops
      # the old committed alerts.md (the issue is the artifact now) and
      # sweeps any dated archive left at the top level into history/.
      #
      # It never overwrites an existing history/ file. report.py is the only
      # thing that should author those; if one is already there, the stray
      # top-level copy is stale and just gets deleted. That's what stops the
      # add/add rebase conflict against the snapshot workflow.
      - name: Tidy reports/
        run: |
          mkdir -p reports/history
          rm -f reports/alerts.md
          for f in reports/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].md; do
            [ -e "$f" ] || continue
            dest="reports/history/$(basename "$f")"
            if [ -e "$dest" ]; then
              rm -f "$f"
            else
              mv "$f" "$dest"
            fi
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/state reports inputs/squad.txt
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "market: $(date -u +%FT%RZ)"
          # The snapshot workflow pushes to the same branch — rebase, and
          # retry rather than dying on a race.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -X theirs; then
              if git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "attempt $attempt failed; retrying"
            sleep 7
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      - name: Open an issue if something fired
        if: steps.watch.outputs.fired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.watch.outputs.path }}
        run: |
          gh issue create \
            --title "Market alert $(date -u +%F\ %R)" \
            --body-file "$BODY"
