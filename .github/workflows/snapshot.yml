name: daily snapshot

# futbolfantasy reflects LaLiga's ~00:15 Europe/Madrid value recompute.
# Cron is UTC: 22:40 UTC = 00:40 CEST. Switch to '40 23 * * *' when Spain
# goes back to CET at the end of October.
#
# The 09:40 UTC run is not a duplicate — probable XIs firm up through the day.
on:
  schedule:
    - cron: '40 22 * * *'
    - cron: '40 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install httpx lxml cssselect

      - name: Fetch
        env:
          FF_ROOT: ./data
        run: python src/ff_ingest.py fetch

      # Re-parsing all history each run takes seconds and means a parser fix
      # retroactively repairs every past snapshot.
      - name: Parse
        env:
          FF_ROOT: ./data
        run: python src/ff_ingest.py parse

      - name: Report
        env:
          FF_ROOT: ./data
        run: python src/report.py

      # rivals.py is the only writer of reports/behaviour.md, and it used to
      # run on manual dispatch only — which is why that file, linked three
      # times from latest.md, had never once been committed.
      - name: League behaviour
        env:
          FF_ROOT: ./data
        run: python src/rivals.py

      - name: Bid log
        env:
          FF_ROOT: ./data
        run: python src/bids.py

      - name: Cash and warnings
        run: |
          {
            echo '## Cash'
            sed -n '/^## 1\./,/^## 2\./p' reports/behaviour.md \
              | grep '^|' || echo '_no cash table_'
            echo '### Warnings'
            grep -A20 '^## Ledger warnings' reports/behaviour.md \
              | grep '^- ' || echo '_none_'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          mkdir -p reports reports/history
          git add -A data reports inputs
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H%MZ)"
          # The market workflow pushes to the same branch. Everything this job
          # writes under reports/ is regenerated from scratch each run, so on a
          # collision this run's copy is the correct one to keep. During a
          # rebase "theirs" means the commit being replayed — i.e. ours.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -X theirs; then
              if git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "attempt $attempt failed; retrying"
            sleep 7
          done
          echo "::error::could not push after 3 attempts — pull/push race or a real conflict outside reports/"
          exit 1

      - name: Fail loudly
        if: failure()
        run: |
          echo "::error::Snapshot failed — markup may have changed, or we're being rate limited."
          exit 1
