# inputs/league.ini — every tuning constant that used to be hardcoded across
# squads.py, watch.py and report.py. All keys optional; defaults in
# ffcore/league.py apply to anything you leave out.

[league]
me = miguel_autentico
budget = 100.000.000

# The app pays a small allowance every day. It is not in the activity feed and
# never will be — that records deals, not gifts — so without it a rival's
# estimated balance drifts further below the truth with every day the season
# runs, and he looks less able to answer a clause than he is. Applied only to
# ESTIMATED balances: an observed one already contains every bonus paid.
daily_bonus = 100000

[budget]
# Per-manager override, only if someone started with a different budget.
# Handles are case-sensitive and must match rosters_initial.txt exactly.
# Magic Mike 333 = 100000000

[thresholds]
# Only what something still reads. top_n_per_pos, keeper_start and riser_pct
# sized the watchlist and watch.py's alerts and went with the board on
# 2026-08-18; they are ignored now, like lambda_buffer before them, so a line
# left here does nothing rather than breaking the run.
min_start     = 60    ; a start percentage below this is not a probable XI
start_cross   = 70    ; squads.py counts your likely starters at this line
shrink_k      = 8     ; matches of shrinkage in the scorer

