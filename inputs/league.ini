# inputs/league.ini — every tuning constant that used to be hardcoded across
# squads.py, watch.py and report.py. All keys optional; defaults in
# ffcore/league.py apply to anything you leave out.

[league]
me = miguel_autentico
budget = 100.000.000

[budget]
# Per-manager override, only if someone started with a different budget.
# Handles are case-sensitive and must match rosters_initial.txt exactly.
# Magic Mike 333 = 100000000

[thresholds]
min_start     = 60    ; watchlist floor
top_n_per_pos = 8     ; watchlist rows per position
start_cross   = 70    ; watch.py alerts on crossing this
keeper_start  = 80    ; a nailed-on keeper is the standing need
riser_pct     = 2     ; 24h move as % of value
shrink_k      = 8     ; matches of shrinkage in report.py's scorer

# The exchange rate between XI points and cash (ffcore/bid.py). λ itself is
# measured, not configured: it is what your last affordable euro buys today.
# This is the only haircut on it — how much better than that rate a purchase
# has to be before it is worth doing. 0.25 = 25% better. Raise it to buy less.
lambda_buffer = 0.25
