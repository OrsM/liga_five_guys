[project]
name = "liga-five-guys"
version = "0.1.0"
description = "Data-driven decision system for LaLiga Fantasy -- one private league"
requires-python = ">=3.12"

# Four, and each earns it. The rule used to be "there is no fourth", which was
# a rule this repo made up about itself rather than a constraint anybody
# imposed — and numpy is about as safe as a dependency gets.
#
#   lxml + cssselect  the HTML parsers in ffcore/futbolfantasy.py; cssselect
#                     is what lxml's CSSSelector needs and is not pulled in
#                     by lxml.
#   httpx             the only network client, imported INSIDE ingest.fetch()
#                     and auth so the test path never needs it.
#   numpy             the draw in ffcore/season.py, which is a coin and a
#                     resample per player per trial per jornada — twenty
#                     million calls in Python, two array operations here —
#                     and the calibration grid in ffcore/startprob.py. It is
#                     required: the pure-Python fallback is gone.
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "cssselect>=1.2",
    "numpy>=2.5.2",
    "highspy>=1.15.1",
]

[tool.mypy]
# Untyped code is unchecked code: an unannotated parameter or a bare dict
# is Any, and Any turns checking off downstream (a .aid typo for .app_id
# passed that way). So every function is annotated and every generic says
# what it holds.
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
# lxml ships no usable stubs: lxml-stubs types every XPath result as a
# six-way union, which is noise, not safety.
[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "SLF001", "PLC0415"]

# PLC0415 (import outside top level) replaces tools/structure.py's lazy-import
# check. Ruff cannot exempt a single function, and the self-tests import
# locally, so the files below (those that do, or hold a deliberate lazy
# import) are exempt; a new module is checked.
[tool.ruff.lint.per-file-ignores]
"src/act.py" = ["PLC0415"]
"src/assemble.py" = ["PLC0415"]
"src/crosswalk.py" = ["PLC0415"]
"src/decision.py" = ["PLC0415"]
"src/ffcore/auth.py" = ["PLC0415"]
"src/ffcore/clock.py" = ["PLC0415"]
"src/ffcore/crosswalk.py" = ["PLC0415"]
"src/ffcore/db.py" = ["PLC0415"]
"src/ffcore/facts.py" = ["PLC0415"]
"src/ffcore/fixture.py" = ["PLC0415"]
"src/ffcore/fixtures.py" = ["PLC0415"]
"src/ffcore/futbolfantasy.py" = ["PLC0415"]
"src/ffcore/jornadas.py" = ["PLC0415"]
"src/ffcore/laliga_api.py" = ["PLC0415"]
"src/ffcore/league.py" = ["PLC0415"]
"src/ffcore/points.py" = ["PLC0415"]
"src/ffcore/rules.py" = ["PLC0415"]
"src/ffcore/schedule.py" = ["PLC0415"]
"src/ffcore/score.py" = ["PLC0415"]
"src/ffcore/startprob.py" = ["PLC0415"]
"src/ffcore/tidy.py" = ["PLC0415"]
"src/grading.py" = ["PLC0415"]
"src/health.py" = ["PLC0415"]
"src/ingest.py" = ["PLC0415"]
"src/publish.py" = ["PLC0415"]
"src/remind.py" = ["PLC0415"]
"src/run.py" = ["PLC0415"]
"src/sim.py" = ["PLC0415"]
"src/sources.py" = ["PLC0415"]
"tools/board_history.py" = ["PLC0415"]
"tools/golden.py" = ["PLC0415"]
"tools/q.py" = ["PLC0415"]
"tools/sql.py" = ["PLC0415"]

# src/ holds one package (ffcore) plus the top-level stage modules.
# Declaring it here is what lets `import ffcore` work from anywhere --
# 18 files used to insert src/ onto sys.path by hand at import time and
# then silence the linter for the import-not-at-top that caused, 89
# times. The package is the fix; the noqa was the symptom.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.3",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ffcore"]
py-modules = ["run", "ingest", "sources", "crosswalk", "assemble", "decide",
              "sim", "grading", "stats"]
